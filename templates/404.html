{% extends 'base.html' %}
{% block title %}Pagina no encontrada | Sistema Hotel{% endblock %}
{% block content %}
<section class="card">
    <p class="eyebrow">404</p>
    <h2>Pagina no encontrada</h2>
    <p>La pagina solicitada no existe o fue movida.</p>
    <div class="actions">
        <a class="btn" href="{% url 'inicio' %}">Ir al inicio</a>
        {% if user.is_authenticated %}
            <a class="btn secondary" href="{% url 'dashboard' %}">Dashboard</a>
        {% endif %}
    </div>
</section>
{% endblock %}
