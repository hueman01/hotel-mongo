{% extends 'base.html' %}
{% block title %}Eliminar | Sistema Hotel{% endblock %}
{% block content %}
<section class="card">
    <p class="eyebrow">Confirmacion</p>
    <h2>Eliminar {{ config.singular }}</h2>
    <p>Estas seguro de eliminar <strong>{{ objeto }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <div class="actions">
            <button class="btn danger" type="submit">Si, eliminar</button>
            <a class="btn secondary" href="{% url 'listar' modelo %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
